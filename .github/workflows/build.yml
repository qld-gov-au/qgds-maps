name: Build and distribute

# Runs when src/ or build config changes on any tracked environment branch.
# Builds the QLD LGA map assets once per configured client, runs smoke tests,
# then pushes each client output to its corresponding release branch.
#
# Environment branches:
#   feature-test → push → dev build  → release-dev-<client>
#   development  → PR   → dev build  → release-dev-<client>
#   uat          → PR   → dev build  → release-uat-<client>
#   main         → PR   → prod build → release-production-<client>
#
# Client URL sets:
#   feature-test/development use each client's dev_* URLs
#   uat/main use each client's release_* URLs
#
# ── Team configuration ─────────────────────────────────────────────────────────
# DIST_SOURCE  The folder whose contents are pushed to the release branch
# ───────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - feature-test
    paths:
      - 'src/**'
      - 'tests/**'
      - 'build.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build.yml'
  pull_request:
    branches:
      - development
      - uat
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'build.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.client.id }}
    runs-on: ubuntu-latest
    # Skip the pull_request run when the source branch is feature-test — that
    # branch uses the push trigger above so the two events don't double-up.
    if: github.event_name == 'push' || github.head_ref != 'feature-test'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        client:
          - id: qsbc
            dev_image_base_url: https://qsbc.qld.gov.au/_resources/lga-map-images/
            dev_image_data_path: https://www.qsbc.qld.gov.au/__data/assets/file/0033/887226/qsbc-lga-images.json
            dev_geojson_path: https://www.qsbc.qld.gov.au/__data/assets/file/0032/887225/qsbc-interactive-map.json
            release_image_base_url: https://www.qsbc.qld.gov.au/_resources/lga-map-images/
            release_image_data_path: https://www.qsbc.qld.gov.au/__data/assets/file/0033/887226/qsbc-lga-images.json
            release_geojson_path: https://www.qsbc.qld.gov.au/__data/assets/file/0032/887225/qsbc-interactive-map.json

    env:
      DIST_SOURCE: dist

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # required for worktree to access remote branches

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Resolve environment config
        id: config
        run: |
          # On pull_request events use the target branch; on push use the source branch
          REF="${{ github.base_ref || github.ref_name }}"
          case "$REF" in
            main) echo "build_env=prod"  >> "$GITHUB_OUTPUT"
                  echo "release_branch=release-production-${{ matrix.client.id }}" >> "$GITHUB_OUTPUT"
                  echo "image_base_url=${{ matrix.client.release_image_base_url }}" >> "$GITHUB_OUTPUT"
                  echo "image_data_path=${{ matrix.client.release_image_data_path }}" >> "$GITHUB_OUTPUT"
                  echo "geojson_path=${{ matrix.client.release_geojson_path }}" >> "$GITHUB_OUTPUT" ;;
            uat)  echo "build_env=dev"   >> "$GITHUB_OUTPUT"
                  echo "release_branch=release-uat-${{ matrix.client.id }}" >> "$GITHUB_OUTPUT"
                  echo "image_base_url=${{ matrix.client.release_image_base_url }}" >> "$GITHUB_OUTPUT"
                  echo "image_data_path=${{ matrix.client.release_image_data_path }}" >> "$GITHUB_OUTPUT"
                  echo "geojson_path=${{ matrix.client.release_geojson_path }}" >> "$GITHUB_OUTPUT" ;;
            *)    echo "build_env=dev"   >> "$GITHUB_OUTPUT"
                  echo "release_branch=release-dev-${{ matrix.client.id }}" >> "$GITHUB_OUTPUT"
                  echo "image_base_url=${{ matrix.client.dev_image_base_url }}" >> "$GITHUB_OUTPUT"
                  echo "image_data_path=${{ matrix.client.dev_image_data_path }}" >> "$GITHUB_OUTPUT"
                  echo "geojson_path=${{ matrix.client.dev_geojson_path }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build
        env:
          QGDS_EXT_LEAFLET_IMAGE_BASE_URL: ${{ steps.config.outputs.image_base_url }}
          QGDS_EXT_LEAFLET_IMAGE_DATA_PATH: ${{ steps.config.outputs.image_data_path }}
          QGDS_EXT_LEAFLET_GEOJSON_PATH: ${{ steps.config.outputs.geojson_path }}
        run: npm run build:${{ steps.config.outputs.build_env }}

      - name: Run smoke tests
        run: npm test

      - name: Push dist to ${{ steps.config.outputs.release_branch }}
        if: github.event_name == 'push' || github.event.pull_request.head.repo.fork == false
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          RELEASE_BRANCH="${{ steps.config.outputs.release_branch }}"

          # Set up a worktree for the release branch.
          # Creates an orphan branch on first run; checks it out on subsequent runs.
          if git ls-remote --exit-code --heads origin "$RELEASE_BRANCH" > /dev/null 2>&1; then
            git fetch origin "$RELEASE_BRANCH"
            git worktree add /tmp/dist "$RELEASE_BRANCH"
          else
            git worktree add --orphan -b "$RELEASE_BRANCH" /tmp/dist
          fi

          # Replace the release branch contents with the current build output
          rm -rf /tmp/dist/*
          cp -r "${{ env.DIST_SOURCE }}/." /tmp/dist/

          cd /tmp/dist
          git add --all

          if git diff --cached --quiet; then
            echo "::notice::No changes to dist — skipping commit."
            exit 0
          fi

          git commit -m "dist(${{ github.ref_name }}): ${{ github.sha }}"
          git push origin "$RELEASE_BRANCH"
